    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // This script must run as early as possible to intercept assignments to window.fetch.
      (function() {
        var _originalFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return _originalFetch; },
            set: function(v) { 
              console.warn('Intercepted attempt to overwrite window.fetch');
              _originalFetch = v; 
            }
          });
        } catch (err) {
          // If defineProperty fails, we can't do much, but at least we don't trigger the error ourselves.
        }
      })();
    </script>
